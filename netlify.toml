# Frontend Vue 3 (Vite) nằm trong thư mục frontend/
[build]
  base = "frontend"
  # npm ci cài lại dependencies sạch cho Linux (node_modules không được commit lên git)
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Backend Spring Boot (Java) không chạy được trên Netlify.
# Khi đã deploy backend ở nơi khác (Render, Railway, VPS...), bỏ comment
# và thay URL để chuyển tiếp mọi request /api/* sang backend đó.
# Rule này phải đứng TRƯỚC rule SPA bên dưới.
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend.example.com/api/:splat"
#   status = 200
#   force = true

# Vue Router dùng history mode: trả index.html cho mọi đường dẫn
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
