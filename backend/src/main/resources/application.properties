server.port=8080

# MySQL (docker-compose.yml ở thư mục gốc dự án tạo sẵn DB này)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/qldg?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# ponytail: ddl-auto=update đủ cho đồ án; khi lên production chuyển sang Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Khóa ký token. Đổi khi triển khai thật.
app.token-secret=${TOKEN_SECRET:qldg-dev-secret-change-me}
# Bật API "Fake Token" cho môi trường dev (đăng nhập Google thật do nhóm khác làm)
app.dev.fake-token=${DEV_FAKE_TOKEN:true}
# Thư mục lưu file lịch dạy đã tải lên (hàng đợi đọc từ đây)
app.upload-dir=${UPLOAD_DIR:uploads}
